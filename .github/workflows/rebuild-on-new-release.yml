name: Test, and rebuild on a new upstream release

# Follows upstream's STABLE releases (vX.Y.Z) and nothing else. Upstream also
# publishes :latest and :dev, which move whenever their main branch moves; a Flux
# app pinned to a rolling tag gets its containers rebuilt onto unreleased code and
# every customer's server restarted with it.
#
# Publishing :latest DOES reach running servers: FluxOS's image update service
# checks every app's tag every six hours and soft-redeploys onto a new image, which
# restarts the server. So a scheduled run publishes only when there is something to
# apply (.github/ci/needs-rebuild.sh): a new stable upstream release, an urgent
# security update, or commits on main the published image does not have. A push to
# main or a manual run always builds.

on:
  schedule:
    # Mondays, once a week (it used to be daily).
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Upstream tag to build (e.g. v2.7.2). Blank = newest stable.'
        required: false
        default: ''

env:
  IMAGE_NAME: runonflux/palworld-server-flux
  BASE_REPO: thijsvanloef/palworld-server-docker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: for f in scripts/*.sh tests/*.sh .github/ci/*.sh; do bash -n "$f"; done

      # The same shellcheck the README tells you to run locally. The one in the
      # runner's apt repository is older and reports a different set of infos, so
      # pinning it here is what makes "lint is clean on my machine" mean anything.
      - name: Shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -x scripts/*.sh tests/*.sh .github/ci/*.sh

      - name: Unit tests
        run: ./tests/test-flux.sh

  # Which upstream release, and is there anything to publish? Always yes for a push or a
  # manual run; for the scheduled run, see .github/ci/needs-rebuild.sh.
  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares the published image's revision label with this history.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - id: check
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: .github/ci/needs-rebuild.sh "${IMAGE_NAME}" "${BASE_REPO}"

  build:
    needs: [test, check]
    # A pull request gets the tests and nothing else: it must not publish. A scheduled run with
    # nothing new stops at the check.
    if: github.event_name != 'pull_request' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PALWORLD_VERSION=${{ needs.check.outputs.version }}
            FLUX_IMAGE_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.base.name=docker.io/${{ env.BASE_REPO }}:${{ needs.check.outputs.version }}
            org.opencontainers.image.base.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
